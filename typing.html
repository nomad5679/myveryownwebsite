<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>typing test</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Inter:wght@400;500&family=Lexend+Deca:wght@500&family=UnifrakturCook:wght@700&family=IM+Fell+English&display=swap" rel="stylesheet">
<style>
  :root { --bg:#1c1d21; --panel:#16171a; --dim:#55585f; --text:#e4e5e8; --accent:#8ec5b4; --err:#e5646e; --extra:#9b3d45; --pace:#7d8087; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:5.5rem 1.25rem 2rem;
         background:var(--bg); color:var(--text); font-family:Inter, system-ui, sans-serif; }
  main { width:100%; max-width:1000px; position:relative; z-index:1; }

  .configs { display:flex; flex-direction:column; align-items:center; gap:.6rem; margin-bottom:3rem; }
  .config { display:flex; flex-wrap:wrap; justify-content:center; gap:.5rem; align-items:center; width:fit-content; max-width:100%; padding:.4rem .6rem;
            background:var(--panel); border-radius:.7rem; transition:opacity .3s; }
  .group { display:flex; gap:.15rem; }
  .divider { width:2px; height:1.2rem; background:var(--bg); border-radius:2px; margin:0 .4rem; }
  .config button { background:none; border:0; color:var(--dim); font:inherit; font-size:.9rem; padding:.45rem .75rem;
                   border-radius:.45rem; cursor:pointer; transition:color .15s; }
  .config button:hover { color:var(--text); }
  .config button.on { color:var(--accent); }

  .counter { height:2.4rem; font-size:1.6rem; color:var(--accent); font-variant-numeric:tabular-nums; margin-bottom:.4rem; }

  .box { font-family:"JetBrains Mono", ui-monospace, Menlo, monospace; font-size:clamp(1.15rem, 3.2vw, 1.75rem);
         height:4.35em; overflow:hidden; user-select:none; position:relative; }
  #stage { position:relative; transition:transform .15s ease-out; }
  #words { display:flex; flex-wrap:wrap; }
  .word { margin-right:.65em; line-height:1.45em; color:var(--dim); }
  .word i { font-style:normal; transition:color .08s; }
  .word .ok { color:var(--text); }
  .word .wrong { color:var(--err); }
  .word .extra { color:var(--extra); }
  .word.bad { text-decoration:underline var(--err) 2px; text-underline-offset:.2em; }

  #caret { position:absolute; left:0; top:0; width:2px; height:1.1em; margin-top:.17em; background:var(--accent);
           border-radius:2px; transition:transform .09s ease-out; animation:blink 1s infinite; }
  body.typing #caret { animation:none; }
  @keyframes blink { 50% { opacity:0; } }
  .box.nope #caret { background:var(--err); }
  #ghost { position:absolute; left:0; top:0; height:1.4em; margin-top:.025em; border:1px solid var(--pace);
           border-radius:.2em; opacity:.6; pointer-events:none; box-sizing:border-box; }
  .logo { font-family:"Lexend Deca", Inter, system-ui, sans-serif; font-weight:500; font-size:2rem; letter-spacing:-.01em;
          text-align:center; margin:0; position:absolute; top:1.5rem; left:0; right:0; z-index:1; color:var(--text); transition:opacity .3s; }
  .logo span { color:var(--accent); }
  #pace { width:6.5rem; }

  canvas.fx { position:fixed; left:0; top:0; pointer-events:none; }
  body.nokb .kb { display:none; }

  .kb { margin:2.4rem auto 0; display:flex; flex-direction:column; align-items:center; gap:.4rem;
        font-family:"JetBrains Mono", ui-monospace, monospace; --ks:clamp(1.7rem, 5.6vw, 2.7rem); }
  .kbrow { display:flex; gap:.4rem; }
  .key { position:relative; width:var(--ks); height:var(--ks); display:flex; align-items:center; justify-content:center;
         border-radius:.45rem; background:var(--panel); color:var(--dim); font-size:clamp(.7rem, 2vw, .95rem);
         box-shadow:0 2px 0 #0f1012; user-select:none; }
  .key.space { width:calc(var(--ks) * 6); }
  .key .pop { position:absolute; left:0; right:0; top:0; text-align:center; line-height:var(--ks); pointer-events:none; }

  .results.show .stats > div { animation:rise .7s cubic-bezier(.2,.8,.2,1) both; }
  .results.show .stats > div:nth-child(2) { animation-delay:.12s; }
  .results.show .stats > div:nth-child(3) { animation-delay:.24s; }
  .results.show #again { animation:rise .7s cubic-bezier(.2,.8,.2,1) .5s both; }
  .results.show #rWpm { animation:glow 1.6s ease-out; }
  @keyframes rise { from { opacity:0; transform:translateY(28px) scale(.9); } to { opacity:1; transform:none; } }
  @keyframes glow { 0% { text-shadow:0 0 0 transparent; } 30% { text-shadow:0 0 40px var(--accent); } 100% { text-shadow:0 0 0 transparent; } }
  @media (prefers-reduced-motion: reduce) { .results.show * { animation:none !important; } }

  body.tape .box { height:1.6em; -webkit-mask-image:linear-gradient(90deg, transparent, #000 12%, #000 88%, transparent);
                   mask-image:linear-gradient(90deg, transparent, #000 12%, #000 88%, transparent); }
  body.tape #stage { transition:transform .12s ease-out; }
  body.tape #words { flex-wrap:nowrap; }
  body.tape .word { flex:none; }

  .config input { width:5rem; background:transparent; border:0; outline:none; color:var(--dim); font:inherit; font-size:.9rem;
                  padding:.45rem .4rem; border-radius:.45rem; text-align:center; -moz-appearance:textfield; transition:color .15s; }
  .config input::-webkit-inner-spin-button, .config input::-webkit-outer-spin-button { -webkit-appearance:none; margin:0; }
  .config input::placeholder { color:var(--dim); }
  .config input:hover, .config input:focus { color:var(--text); }
  .config input.on { color:var(--accent); }

  body.typing .logo, body.typing .configs, body.typing .hint, body.typing .bottom { opacity:0; pointer-events:none; }

  .results { display:none; text-align:center; }
  .results.show { display:block; }
  .stats { display:flex; justify-content:center; gap:clamp(1.5rem, 6vw, 4rem); margin-bottom:2.5rem; }
  .stats span { display:block; font-size:clamp(2.8rem, 9vw, 5rem); line-height:1; color:var(--accent); font-weight:500; }
  .stats label { color:var(--dim); font-size:.9rem; }
  #again { background:var(--panel); color:var(--text); border:0; font:inherit; padding:.7rem 1.5rem; border-radius:.6rem;
           cursor:pointer; transition:background .15s, color .15s; }
  #again:hover { background:var(--accent); color:var(--bg); }

  .hint { text-align:center; color:var(--dim); font-size:.85rem; margin-top:3rem; transition:opacity .3s; }
  kbd { background:var(--panel); padding:.15rem .45rem; border-radius:.3rem; font:inherit; }

  /* ---- bottom bar, warning, explosion bits (normal mode) ---- */
  .bottom { margin-top:2.5rem; display:flex; flex-direction:column; align-items:center; gap:.9rem; transition:opacity .3s; }
  .tbtn { background:var(--panel); color:var(--err); border:1px solid #3a2326; font:inherit; font-size:.8rem; letter-spacing:.12em;
          padding:.6rem 1.3rem; border-radius:.5rem; cursor:pointer; transition:background .15s, color .15s; }
  .tbtn:hover, .tbtn.on { background:var(--err); color:var(--bg); }

  .warn { position:fixed; inset:0; display:none; align-items:center; justify-content:center; background:rgba(0,0,0,.82); z-index:10; padding:1rem; }
  .warn.show { display:flex; }
  .warnbox { background:var(--panel); border:2px solid var(--err); border-radius:.8rem; padding:2rem 2.5rem; text-align:center; max-width:27rem; }
  .warnbox h2 { margin:0 0 .8rem; color:var(--err); font-size:2.6rem; letter-spacing:.1em; animation:blink .8s steps(1) infinite; }
  .warnbox p { margin:0 0 1.6rem; color:var(--text); line-height:1.5; }
  .warnbox button { font:inherit; font-size:.9rem; padding:.6rem 1.2rem; margin:0 .3rem; border:0; border-radius:.5rem; cursor:pointer;
                    background:var(--bg); color:var(--text); }
  .warnbox button:first-of-type { background:var(--err); color:var(--bg); }

  #tvid { position:fixed; left:0; top:0; width:100%; height:100%; object-fit:cover; z-index:0; display:none; }
  .fireball { position:fixed; width:320px; height:320px; pointer-events:none; z-index:8;
              background:radial-gradient(circle, #fff 0, #ffee33 20%, #ff8800 45%, #ff2200 62%, transparent 70%); }
  .flash { position:fixed; left:0; top:0; width:100%; height:100%; background:#fff; pointer-events:none; z-index:9; }
  .fuse { display:none; }
  .rope { display:block; position:absolute; bottom:0; left:-2px; width:4px; height:90px;
          background:repeating-linear-gradient(#a52 0 4px, #fc8 4px 8px); }
  .rope::after { content:""; position:absolute; top:-8px; left:-4px; width:12px; height:12px; background:#ff0; clip-path:circle(50%); }
  @keyframes burn { from { height:90px; } to { height:0; } }

  .ring { position:fixed; width:200px; height:200px; border:4px solid #fff; border-radius:50%; pointer-events:none; z-index:8; }
  #vig { display:none; position:fixed; left:0; top:0; width:100%; height:100%; pointer-events:none; z-index:3;
         background:radial-gradient(ellipse at center, transparent 45%, rgba(40,0,6,.55) 80%, rgba(0,0,0,.92) 100%); }
  @keyframes vig { 0%{opacity:1} 40%{opacity:.85} 43%{opacity:.4} 46%{opacity:1} 80%{opacity:.9} 83%{opacity:.5} 85%{opacity:1} }

  /* ---- TRUTH MODE: gothic, burning, unstable ---- */
  body.truth { --bg:#0a0405; --panel:#150608; --dim:#9a4a2a; --text:#f2e3c8; --accent:#ff3b1f; --err:#ff2a2a; --extra:#7a0000;
               animation:flame .24s steps(1) infinite; }
  body.truth.hasvid #tvid { display:block; }
  body.truth #vig { display:block; animation:vig 6s steps(1) infinite !important; }
  body.truth * { font-family:"IM Fell English", Georgia, "Times New Roman", serif !important; transition:none !important; animation:none !important; }
  body.truth .logo, body.truth .logo span, body.truth .stats label, body.truth .counter, body.truth button
    { font-family:"UnifrakturCook", "Old English Text MT", fantasy !important; }
  body.truth.tape .box { -webkit-mask-image:none; mask-image:none; }
  body.truth .logo { font-size:2.8rem; color:#c1121f; }
  body.truth .logo span { color:var(--text); }
  body.truth .config { background:none; padding:0; }
  body.truth .divider { display:none; }
  body.truth kbd { background:none; padding:0; }
  body.truth .key { background:none; border:1px solid #4a1a14; box-shadow:none; }
  body.truth button { background:#1a0507; color:#e8d5b5; border:0; border-radius:0; padding:.5rem .9rem; margin:.15rem;
                      font-size:1.05rem; cursor:crosshair; clip-path:var(--clip, none); }
  body.truth button:hover { background:#c1121f; color:#000; }
  body.truth .config button.on { background:#7a0c14; color:#fff; text-decoration:underline wavy; }
  body.truth .config input { background:#1a0507; color:#e8d5b5; border:0; border-radius:0; padding:.5rem .6rem; font-size:1rem;
                             clip-path:var(--clip, none); }
  body.truth .config input.on { color:#ff2a2a; text-decoration:underline wavy; }
  body.truth #again { background:#1a0507; color:#e8d5b5; border-radius:0; font-size:1.5rem; padding:.8rem 1.6rem; }
  body.truth #again:hover { background:#c1121f; color:#000; }
  body.truth .glitch { transform:translateX(4px) skewX(-10deg); filter:hue-rotate(40deg) contrast(1.4); }
  body.truth .results { margin-top:5rem; }
  body.truth .stats > div:first-child { position:relative; }
  body.truth .fuse { display:block; position:absolute; left:50%; top:0; width:0; height:0; }
  body.truth .results.show .rope { animation:burn 3.6s linear forwards !important; }
  @keyframes flame {
    0%  { text-shadow:0 0 2px #fff, 0 -3px 3px #ff3, 1px -7px 5px #fd3, -1px -11px 8px #f80, 2px -16px 12px #f20, 0 -21px 15px #800; }
    33% { text-shadow:0 0 2px #fff, 0 -4px 3px #ff3, -1px -9px 5px #fd3, 2px -14px 9px #f80, -2px -20px 13px #f20, 0 -26px 17px #800; }
    66% { text-shadow:0 0 2px #fff, 0 -2px 3px #ff3, 1px -6px 5px #fd3, -2px -10px 7px #f80, 3px -15px 11px #f20, 0 -19px 14px #800; }
  }
</style>
</head>
<body>
<video id="tvid" muted loop autoplay playsinline></video>
<div id="vig"></div>
<canvas class="fx" id="fxFront" style="z-index:5"></canvas>
<div class="warn" id="warn">
  <div class="warnbox">
    <h2>WARNING</h2>
    <p>truth mode strips all styling, sets your letters on fire, and blows up your results.</p>
    <div><button id="warnYes">enter truth mode</button><button id="warnNo">cancel</button></div>
  </div>
</div>
<h1 class="logo">Truth<span>Type</span></h1>
<main>
  <div class="configs">
    <div class="config">
      <div class="group" id="modes">
        <button data-mode="time">time</button>
        <button data-mode="words">words</button>
      </div>
      <div class="divider"></div>
      <div class="group" id="opts"></div>
    </div>
    <div class="config">
      <div class="group" id="display">
        <button data-display="lines">lines</button>
        <button data-display="tape">tape</button>
      </div>
      <div class="divider"></div>
      <div class="group" id="stop">
        <button data-stop="0">allow errors</button>
        <button data-stop="1">stop on error</button>
      </div>
      <div class="divider"></div>
      <div class="group" id="kbset">
        <button data-kb="1">show keyboard</button>
        <button data-kb="0">hide keyboard</button>
      </div>
      <div class="divider"></div>
      <input id="pace" type="number" min="1" max="500" placeholder="pace wpm">
    </div>
  </div>

  <div id="test">
    <div class="counter" id="counter"></div>
    <div class="box"><div id="caret"></div><div id="stage"><div id="ghost"></div><div id="words"></div></div></div>
    <div class="kb" id="kb"></div>
  </div>

  <section class="results" id="results">
    <div class="stats">
      <div><div class="fuse"><i class="rope"></i></div><span id="rWpm"></span><label id="lWpm">wpm</label></div>
      <div><span id="rAcc"></span><label id="lAcc">accuracy</label></div>
      <div><span id="rTime"></span><label>time</label></div>
    </div>
    <button id="again">next test</button>
  </section>

  <p class="hint"><kbd>tab</kbd> restart test</p>

  <div class="bottom">
    <button class="tbtn" id="truthBtn">TRUTH MODE</button>
  </div>
</main>

<script>
// >>> TRUTH MODE VIDEO BACKGROUND: put your video path or URL between the quotes (e.g. "bg.mp4"). Leave "" for none. <<<
const TRUTH_VIDEO = "";

const LIST = "about above across after again air all almost along also always among animal answer any around away back bag ball bank base beach bear beat bed before begin behind below best better between big bird black blue boat body book both bottom box boy bread bridge bright bring brother build burn busy call camera candle car card carry catch cause center chair change charge check child circle city clean clear climb clock close cloud coast cold color come cook copy corner count country course cover crowd cross dance dark day deep desert dinner direct doctor dog door down dream drive drop dry early earth east easy edge empty end engine enough even evening every face fall family far farm fast field fight fill final find fire first fish flag floor flower fly follow food forest forget fresh friend front fruit game garden gate gift glass gold good grass great green ground group grow hand happy hard head heart heavy help high hill history hold home horse hour house idea inside island jacket join journey jump keep kind king kitchen knife ladder lake land large late laugh leaf learn leave left letter light line listen little live long look loud love machine make map market matter meal metal middle might mind minute mirror moment money moon morning mountain move music name near never night noise north nothing notice ocean office often open orange order paint paper park party past path peace pencil people piece place plain plant play pocket point power pull quick quiet rain reach read ready river road rock room round rule run safe sail salt sand school season seed shadow shape sharp shine ship shoe short shout silver simple sing sister sleep slow small smile smoke snow soft song sound south space speak speed spring square stand star start stone store storm story street strong summer sun table tall taste teach thin think thought throw ticket time tiny today together tower town train travel tree trust turn under until valley village voice wait walk wall warm watch water wave west wheel white wide wind window winter wish wood word work world write year yellow young afternoon beautiful daughter distance example feather finger forward neighbor picture question remember station surface teacher tomorrow weather yesterday".split(" ");

const $ = s => document.querySelector(s);
const wordsEl = $("#words"), caret = $("#caret"), stage = $("#stage"), counter = $("#counter"), ghost = $("#ghost");
const OPTS = { time:[15,30,60,120], words:[10,25,50,100] }, MAX = { time:600, words:1000 };
const cfg = { mode:"time", time:30, words:25, display:"lines", stop:false, pace:0, keyboard:true };
try { Object.assign(cfg, JSON.parse(localStorage.getItem("typing-test") || "{}")); } catch (e) {}
let words=[], typedWords=[], idx=0, typed="", started=false, done=false, t0=0, timer=null, keys=0, good=0, cum=[], total=0, pw=0, raf=0, truth=false, warnOpen=false, fuseT=0, sparkT=0, flyAnims=[], rumbleT=0, emberT=0, boomTs=[], chaosT=0, glitchT=0, hintT=0;

function pick() { let w; do { w = LIST[Math.random()*LIST.length|0]; } while (w === words[words.length-1]); return w; }

function letters(w, t) {
  let h = "";
  for (let i=0; i<w.length; i++) h += `<i class="${t[i]==null ? "" : t[i]===w[i] ? "ok" : "wrong"}">${w[i]}</i>`;
  for (let i=w.length; i<t.length; i++) h += `<i class="extra">${t[i]}</i>`;
  return h;
}

function addWords(n) {
  for (let i=0; i<n; i++) {
    const w = pick(); words.push(w); cum.push(total); total += w.length + 1;
    const d = document.createElement("div");
    d.className = "word"; d.innerHTML = letters(w, "");
    wordsEl.append(d);
  }
}

function render(i) {
  const d = wordsEl.children[i];
  d.innerHTML = letters(words[i], i===idx ? typed : (typedWords[i] ?? ""));
  d.classList.toggle("bad", i<idx && typedWords[i] !== words[i]);
}

function moveCaret() {
  const w = wordsEl.children[idx], n = w.children.length;
  const x = typed.length < n ? w.children[typed.length].offsetLeft
                             : w.lastElementChild.offsetLeft + w.lastElementChild.offsetWidth;
  if (cfg.display === "tape") {
    const mid = caret.parentElement.clientWidth / 2;
    caret.style.transform = `translate(${mid}px, 0)`;
    stage.style.transform = `translateX(${mid - x}px)`;
  } else {
    const shift = Math.max(0, w.offsetTop - wordsEl.children[0].offsetHeight);
    caret.style.transform = `translate(${x}px, ${w.offsetTop - shift}px)`;
    stage.style.transform = `translateY(${-shift}px)`;
  }
}

function correctChars() {
  let c = 0;
  for (let i=0; i<idx; i++) if (typedWords[i] === words[i]) c += words[i].length + 1;
  if (words[idx].startsWith(typed)) c += typed.length;
  return c;
}

function setCounter() {
  counter.textContent = cfg.mode==="time" ? cfg.time - Math.min(cfg.time, Math.floor(started ? (performance.now()-t0)/1000 : 0))
                                          : `${idx}/${cfg.words}`;
}

function placePace(pos) {
  while (pw + 1 < cum.length && cum[pw+1] <= pos) pw++;
  if (cfg.mode === "time" && pw > words.length - 40) addWords(60);
  const w = wordsEl.children[pw], len = words[pw].length;
  const li = Math.floor(pos - cum[pw]), f = pos - cum[pw] - li;
  let x, bw;
  if (li < len) {
    const el = w.children[li];
    x = el.offsetLeft + f * el.offsetWidth; bw = el.offsetWidth;
  } else {
    const last = w.children[len-1], nx = wordsEl.children[pw+1];
    bw = last.offsetWidth; x = last.offsetLeft + last.offsetWidth;
    if (nx && nx.offsetTop === w.offsetTop) x += f * (nx.offsetLeft - x);
  }
  ghost.style.width = (bw + 6) + "px";
  ghost.style.transform = `translate(${x - 3}px, ${w.offsetTop}px)`;
}

function paceLoop() {
  if (!started || done || !cfg.pace) return;
  placePace((performance.now() - t0) / 12000 * cfg.pace);
  raf = requestAnimationFrame(paceLoop);
}

function start() {
  started = true; t0 = performance.now();
  document.body.classList.add("typing");
  paceLoop();
  timer = setInterval(() => {
    const s = (performance.now()-t0)/1000;
    if (cfg.mode==="time") { counter.textContent = Math.max(0, Math.ceil(cfg.time - s)); if (s >= cfg.time) finish(cfg.time); }
  }, 100);
}

function finish(sec) {
  done = true; clearInterval(timer); cancelAnimationFrame(raf);
  sec = sec || (performance.now()-t0)/1000;
  const wpm = Math.round(correctChars()/5/(sec/60)), acc = keys ? Math.round(good/keys*100) : 100;
  $("#lWpm").textContent = truth ? "truth units" : "wpm";
  $("#lAcc").textContent = truth ? "truth percentage" : "accuracy";
  document.body.classList.remove("typing");
  $("#test").style.display = "none";
  $("#results").classList.add("show");
  countUp($("#rWpm"), wpm, ""); countUp($("#rAcc"), acc, "%"); countUp($("#rTime"), Math.round(sec), "s");
  const r = $("#rWpm").getBoundingClientRect();
  if (truth) startFuse(); else burst(r.left + r.width/2, r.top + r.height/2, 70 + Math.min(wpm, 150));
}

function reset() {
  clearInterval(timer);
  started = done = false; idx = 0; typed = ""; typedWords = []; keys = good = 0; words = []; cum = []; total = 0; pw = 0; cancelAnimationFrame(raf);
  clearTimeout(fuseT); clearInterval(sparkT); flyAnims.forEach(a => a.cancel()); flyAnims = [];
  clearInterval(rumbleT); clearInterval(emberT); boomTs.forEach(clearTimeout); boomTs = []; $("main").style.transform = "";
  wordsEl.innerHTML = ""; stage.style.transform = "";
  addWords(cfg.mode==="time" ? 80 : cfg.words);
  document.body.classList.remove("typing");
  $("#test").style.display = ""; $("#results").classList.remove("show");
  setCounter(); moveCaret(); if (cfg.pace) placePace(0);
}

function buildConfig() {
  const mark = (sel, attr, val) => document.querySelectorAll(sel + " button").forEach(b => b.classList.toggle("on", b.dataset[attr] === String(val)));
  mark("#modes", "mode", cfg.mode); mark("#display", "display", cfg.display); mark("#stop", "stop", +cfg.stop); mark("#kbset", "kb", +cfg.keyboard);
  const custom = !OPTS[cfg.mode].includes(cfg[cfg.mode]);
  $("#opts").innerHTML = OPTS[cfg.mode].map(v => `<button data-v="${v}" class="${v===cfg[cfg.mode] ? "on" : ""}">${v}</button>`).join("")
    + `<input type="number" min="1" max="${MAX[cfg.mode]}" placeholder="custom" value="${custom ? cfg[cfg.mode] : ""}" class="${custom ? "on" : ""}">`;
  document.body.classList.toggle("tape", cfg.display === "tape");
  document.body.classList.toggle("nokb", !cfg.keyboard);
  $("#pace").value = cfg.pace || ""; $("#pace").classList.toggle("on", cfg.pace > 0);
  ghost.style.display = cfg.pace ? "" : "none";
  try { localStorage.setItem("typing-test", JSON.stringify(cfg)); } catch (e) {}
}

$("#modes").onclick = e => { const b = e.target.closest("button"); if (!b) return; cfg.mode = b.dataset.mode; buildConfig(); reset(); b.blur(); };
$("#opts").onclick  = e => { const b = e.target.closest("button"); if (!b) return; cfg[cfg.mode] = +b.dataset.v; buildConfig(); reset(); b.blur(); };
$("#opts").onchange = e => {
  const n = Math.floor(+e.target.value);
  if (n >= 1) cfg[cfg.mode] = Math.min(MAX[cfg.mode], n);
  buildConfig(); reset();
};
$("#display").onclick = e => { const b = e.target.closest("button"); if (!b) return; cfg.display = b.dataset.display; buildConfig(); reset(); b.blur(); };
$("#stop").onclick    = e => { const b = e.target.closest("button"); if (!b) return; cfg.stop = b.dataset.stop === "1"; buildConfig(); reset(); b.blur(); };
$("#kbset").onclick  = e => { const b = e.target.closest("button"); if (!b) return; cfg.keyboard = b.dataset.kb === "1"; buildConfig(); b.blur(); };
$("#pace").onchange = e => {
  const n = Math.floor(+e.target.value);
  cfg.pace = n >= 1 ? Math.min(500, n) : 0;
  buildConfig(); reset();
};
$("#again").onclick = e => { reset(); e.target.blur(); };

document.addEventListener("keydown", e => {
  if (warnOpen) {
    if (e.key === "Enter") { e.preventDefault(); $("#warnYes").click(); }
    else if (e.key === "Escape") $("#warnNo").click();
    return;
  }
  if (e.target.tagName === "INPUT") { if (e.key === "Enter" || e.key === "Escape") e.target.blur(); return; }
  if (e.key === "Tab" || e.key === "Escape") { e.preventDefault(); reset(); return; }
  if (done) { if (e.key === "Enter") reset(); return; }

  if (e.key === "Backspace") {
    e.preventDefault();
    if (e.ctrlKey || e.altKey) typed = "";
    else if (typed) typed = typed.slice(0, -1);
    else if (idx > 0 && typedWords[idx-1] !== words[idx-1]) { idx--; typed = typedWords[idx]; render(idx+1); }
    else return;
    render(idx); moveCaret(); return;
  }

  if (e.ctrlKey || e.metaKey || e.altKey) return;

  if (e.key === " ") {
    e.preventDefault();
    if (!typed || (cfg.stop && typed !== words[idx])) return;
    if (!started) start();
    hit(" ", typed === words[idx]);
    typedWords[idx] = typed; idx++; typed = "";
    render(idx-1);
    if (cfg.mode==="words" && idx >= cfg.words) { idx--; typed = typedWords[idx]; finish(); return; }
    if (cfg.mode==="time" && idx > words.length - 40) addWords(60);
    if (cfg.mode==="words") setCounter();
    moveCaret(); return;
  }

  if (/^[a-zA-Z]$/.test(e.key)) {
    e.preventDefault();
    if (typed.length >= words[idx].length + 8) return;
    if (!started) start();
    const c = e.key.toLowerCase();
    hit(c, c === words[idx][typed.length]);
    keys++;
    if (c === words[idx][typed.length]) good++;
    else if (cfg.stop) {
      const b = caret.parentElement; b.classList.add("nope"); setTimeout(() => b.classList.remove("nope"), 120);
      return;
    }
    typed += c; render(idx); moveCaret();
    if (cfg.mode==="words" && idx === cfg.words-1 && typed === words[idx]) finish();
  }
});

// ----- keyboard -----
const keyEl = {};
[...["qwertyuiop", "asdfghjkl", "zxcvbnm"], " "].forEach(r => {
  const row = document.createElement("div"); row.className = "kbrow";
  for (const ch of r) {
    const k = document.createElement("div");
    k.className = "key" + (ch === " " ? " space" : ""); k.textContent = ch === " " ? "" : ch;
    keyEl[ch] = k; row.append(k);
  }
  $("#kb").append(row);
});

function hit(c, ok) {
  const k = keyEl[c]; if (!k || !cfg.keyboard || truth) return;
  const col = ok ? "#8ec5b4" : "#e5646e";
  k.animate([
    { transform:"translateY(2px) scale(.94)", background:col, color:"#1c1d21", boxShadow:`0 0 8px ${col}` },
    { transform:"translateY(0) scale(1)", background:"#16171a", color:"#55585f", boxShadow:"0 0 0 transparent" }
  ], { duration:260, easing:"cubic-bezier(.2,.8,.2,1)" });
  if (c !== " ") {
    const p = document.createElement("span");
    p.className = "pop"; p.textContent = c; p.style.color = col; k.append(p);
    p.animate([{ transform:"translateY(0)", opacity:.6 }, { transform:"translateY(-22px) scale(1.1)", opacity:0 }],
              { duration:350, easing:"ease-out" }).onfinish = () => p.remove();
  }
}

// ----- finish confetti -----
const fg = $("#fxFront"), fctx = fg.getContext("2d");
const calm = matchMedia("(prefers-reduced-motion: reduce)").matches;
const bits = [];
let W = 0, H = 0, last = performance.now();

function sizeFx() {
  const dpr = Math.min(2, devicePixelRatio || 1); W = innerWidth; H = innerHeight;
  fg.width = W * dpr; fg.height = H * dpr; fg.style.width = W + "px"; fg.style.height = H + "px";
  fctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

function burst(x, y, n) {
  if (calm) return;
  const cols = ["#8ec5b4", "#e4e5e8", "#f0c674", "#7db4e6", "#e5646e"];
  for (let i = 0; i < n; i++) {
    const a = -Math.PI/2 + (Math.random() - .5) * Math.PI * 1.1, v = 500 + Math.random() * 900;
    bits.push({ x, y, vx:Math.cos(a)*v, vy:Math.sin(a)*v, rot:Math.random()*6, vr:(Math.random()-.5)*16,
                s:5 + Math.random()*7, c:cols[i % cols.length], life:1.6 + Math.random()*1.2 });
  }
}

function countUp(el, to, suf) {
  const t = performance.now();
  (function f(n) {
    const p = Math.min(1, (n - t) / 900);
    el.textContent = Math.round(to * (1 - Math.pow(1 - p, 3))) + suf;
    if (p < 1) requestAnimationFrame(f);
  })(t);
}

function fxLoop(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  fctx.clearRect(0, 0, W, H);
  for (let i = bits.length - 1; i >= 0; i--) {
    const b = bits[i]; b.life -= dt;
    if (b.life <= 0) { bits.splice(i, 1); continue; }
    b.vy += (b.g ?? 1500) * dt; b.vx *= 1 - 1.2 * dt; b.x += b.vx * dt; b.y += b.vy * dt; b.rot += b.vr * dt;
    fctx.save(); fctx.globalAlpha = Math.min(1, b.life / .4); fctx.translate(b.x, b.y); fctx.rotate(b.rot);
    fctx.fillStyle = b.c; fctx.fillRect(-b.s/2, -b.s/4, b.s, b.s/2); fctx.restore();
  }
  requestAnimationFrame(fxLoop);
}

// ----- truth mode: fuse, explosions, chaos -----
const mainEl = $("main"), vid = $("#tvid"), warn = $("#warn"), hint = $(".hint"), hint0 = hint.innerHTML;
const rnd = a => a[Math.random() * a.length | 0];
const WORDS = ["stay", "listen", "watch", "faster", "again", "behind you"], RUNES = "†‡ᚦᛟ¶§ΩØ";
const CREEPY = ["it counts every key", "you are being timed", "don't stop now", "someone is reading along", "faster", "the words were here before you"];
const PAIRS = [["#1a0507", "#e8d5b5"], ["#7a0c14", "#fff"], ["#e8d5b5", "#1a0507"], ["#000", "#ff2a2a"], ["#3b0a0f", "#ffd27a"]];
const btns = () => document.querySelectorAll("button, .config input");

function spark(x, y) {
  bits.push({ x, y, vx:(Math.random() - .5) * 160, vy:-30 - Math.random() * 140, rot:0, vr:0, s:2 + Math.random() * 3,
              c:Math.random() < .5 ? "#ffee33" : "#ff7a00", life:.4 + Math.random() * .4 });
}

function boom(x, y, n) {
  const cols = ["#ffffff", "#ffee33", "#ffaa00", "#ff5500", "#ff2200", "#444444"];
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, v = 300 + Math.random() * 1500;
    bits.push({ x, y, vx:Math.cos(a) * v, vy:Math.sin(a) * v - 200, rot:Math.random() * 6, vr:(Math.random() - .5) * 20,
                s:6 + Math.random() * 12, c:cols[i % cols.length], life:1 + Math.random() * 1.4 });
  }
}

function temp(cls, frames, opts, style) {
  const d = document.createElement("div"); d.className = cls; Object.assign(d.style, style || {}); document.body.append(d);
  d.animate(frames, opts).onfinish = () => d.remove();
}

function blast(x, y, n, size, color) {
  boom(x, y, n);
  const at = { left:x + "px", top:y + "px" }, c = "translate(-50%,-50%) ";
  temp("fireball", [{ transform:c + "scale(.1)", opacity:1 }, { transform:c + `scale(${size})`, opacity:0 }], { duration:900, easing:"ease-out" }, at);
  temp("ring", [{ transform:c + "scale(.1)", opacity:.9 }, { transform:c + `scale(${size * 1.4})`, opacity:0 }], { duration:700, easing:"ease-out" }, at);
  temp("flash", [{ opacity:color ? .5 : 1 }, { opacity:0 }], { duration:color ? 300 : 650, easing:"ease-out" }, color ? { background:color } : {});
}

function startFuse() {
  if (calm) return;
  const rope = document.querySelector(".rope"), t0f = performance.now();
  sparkT = setInterval(() => { const r = rope.getBoundingClientRect(); spark(r.left + r.width / 2, r.top); }, 40);
  rumbleT = setInterval(() => {
    const p = (performance.now() - t0f) / 3600, a = p * p * 12;
    mainEl.style.transform = `translate(${(Math.random() - .5) * a}px, ${(Math.random() - .5) * a}px)`;
  }, 30);
  fuseT = setTimeout(blowUp, 3600);
}

function blowUp() {
  clearInterval(sparkT); clearInterval(rumbleT); mainEl.style.transform = "";
  const wr = $("#rWpm").getBoundingClientRect(), cx = wr.left + wr.width / 2, cy = wr.top + wr.height / 2;
  blast(cx, cy, 260, 7);
  [120, 260, 420, 600, 800].forEach(ms => boomTs.push(setTimeout(
    () => blast(Math.random() * innerWidth, Math.random() * innerHeight * .8, 120, 4 + Math.random() * 3, "#a00"), ms)));
  mainEl.animate(Array.from({ length:30 }, (_, i) => {
    const a = 60 * (1 - i / 29);
    return { transform: i === 29 ? "none" : `translate(${(Math.random() - .5) * a}px, ${(Math.random() - .5) * a}px) rotate(${(Math.random() - .5) * a / 10}deg)` };
  }), { duration:1600 });
  document.querySelectorAll(".logo, .configs, .stats > div, #again").forEach(el => {
    const r = el.getBoundingClientRect();
    let ex = r.left + r.width / 2 - cx, ey = r.top + r.height / 2 - cy, d = Math.hypot(ex, ey);
    if (d < 40) { const a = Math.random() * 6.28; ex = Math.cos(a) * 100; ey = Math.sin(a) * 100; d = 100; }
    const k = 1600 / d;
    flyAnims.push(el.animate([
      { transform:"none" },
      { transform:`translate(${ex * k + (Math.random() - .5) * 300}px, ${ey * k - 300 + Math.random() * 200}px) rotate(${(Math.random() - .5) * 1440}deg) scale(${.4 + Math.random()})` }
    ], { duration:1300 + Math.random() * 500, easing:"cubic-bezier(.12,.7,.25,1)", fill:"forwards" }));
  });
  emberT = setInterval(() => bits.push({ x:Math.random() * innerWidth, y:innerHeight + 10, vx:(Math.random() - .5) * 60,
    vy:-200 - Math.random() * 300, g:100, rot:0, vr:0, s:2 + Math.random() * 3, c:rnd(["#ffee33", "#ff7a00", "#ff2200"]), life:1.2 + Math.random() }), 40);
  boomTs.push(setTimeout(() => clearInterval(emberT), 4000));
}

// ---- unpredictable buttons ----
function shard() {
  const j = m => Math.random() * m;
  const pts = [[j(10), j(25)], [35 + j(30), j(12)], [90 + j(10), j(25)], [100 - j(8), 50 + j(10)],
               [90 + j(10), 100 - j(25)], [35 + j(30), 100 - j(12)], [j(10), 100 - j(25)], [j(6), 40 + j(20)]];
  return "polygon(" + pts.map(([x, y]) => x.toFixed(0) + "% " + y.toFixed(0) + "%").join(",") + ")";
}

function scramble(b) {
  const t = b.textContent; if (!t || b.dataset.busy) return;
  b.dataset.busy = 1;
  b.textContent = Math.random() < .4 ? rnd(WORDS) : [...t].map(() => rnd(RUNES)).join("");
  setTimeout(() => { delete b.dataset.busy; if (b.isConnected) b.textContent = t; }, 220);
}

function chaosTick() {
  const all = [...btns()];
  for (let i = 0; i < 3; i++) {
    const b = rnd(all); if (!b) return;
    b.style.transform = `rotate(${(Math.random() - .5) * 14}deg) skew(${(Math.random() - .5) * 16}deg) scale(${.9 + Math.random() * .3})`;
    b.style.setProperty("--clip", shard());
    if (Math.random() < .3) { const [bgc, fgc] = rnd(PAIRS); b.style.background = bgc; b.style.color = fgc; }
    if (Math.random() < .2) b.style.letterSpacing = (Math.random() * 4 - 1) + "px";
  }
}

function glitchTick() {
  const t = rnd([$(".logo"), $(".logo"), $("#rWpm"), $(".box")]);
  t.classList.add("glitch"); setTimeout(() => t.classList.remove("glitch"), 90 + Math.random() * 120);
  glitchT = setTimeout(glitchTick, 1500 + Math.random() * 4500);
}

function hintTick() { hint.textContent = rnd(CREEPY); hintT = setTimeout(hintTick, 3000 + Math.random() * 5000); }

document.addEventListener("mouseover", e => {
  if (!truth) return;
  const b = e.target.closest("button, .config input");
  if (!b || b.contains(e.relatedTarget)) return;
  if (b.tagName === "BUTTON") scramble(b);
  if (Math.random() < .5) b.style.transform = `translate(${(Math.random() - .5) * 140}px, ${(Math.random() - .5) * 90}px) rotate(${(Math.random() - .5) * 40}deg)`;
  b.style.setProperty("--clip", shard());
});
document.addEventListener("click", e => {
  if (!truth || Math.random() > .15) return;
  const b = e.target.closest("button");
  if (b) b.animate([{ transform:"rotate(0)" }, { transform:`rotate(${rnd([-1, 1]) * 720}deg) scale(1.4)` }, { transform:"rotate(0)" }], { duration:600 });
}, true);

// ---- entering / leaving truth mode ----
function applyVideo(src) {
  if (src) { vid.src = src; vid.play().catch(() => {}); } else { vid.removeAttribute("src"); vid.load(); }
  document.body.classList.toggle("hasvid", !!src);
}
function setTruth(on) {
  truth = on; document.body.classList.toggle("truth", on); $("#truthBtn").classList.toggle("on", on);
  clearInterval(chaosT); clearTimeout(glitchT); clearTimeout(hintT);
  btns().forEach(b => b.removeAttribute("style"));
  hint.innerHTML = hint0;
  if (on) {
    btns().forEach(b => b.style.setProperty("--clip", shard()));
    chaosT = setInterval(chaosTick, 450); glitchT = setTimeout(glitchTick, 2500); hintT = setTimeout(hintTick, 2000);
  }
  reset();
}
function closeWarn() { warnOpen = false; warn.classList.remove("show"); }
$("#truthBtn").onclick = e => { e.target.blur(); if (truth) setTruth(false); else { warn.classList.add("show"); warnOpen = true; } };
$("#warnYes").onclick  = e => { e.target.blur(); closeWarn(); setTruth(true); };
$("#warnNo").onclick   = e => { e.target.blur(); closeWarn(); };

window.addEventListener("resize", () => { sizeFx(); moveCaret(); if (cfg.pace && !started) placePace(0); });
sizeFx(); requestAnimationFrame(fxLoop); applyVideo(TRUTH_VIDEO);
buildConfig(); reset();
if (document.fonts) document.fonts.ready.then(() => { moveCaret(); if (cfg.pace) placePace(0); });
</script>
</body>
